name: Seed reset checks

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/seed*.ts'
      - 'scripts/deploy.sh'
      - 'scripts/systemd/**'
      - 'tests/integration/deploy-pm2.test.sh'
      - 'scripts/check-unlink-release.ts'
      - 'tests/integration/deploy.test.sh'
      - 'tests/integration/telegram-ready.test.mjs'
      - 'tests/integration/rollback-notifications.test.mjs'
      - 'scripts/seed-reset-permit.sql'
      - 'scripts/content/**'
      - 'lib/db/**'
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - 'tests/integration/seed-reset.test.ts'
      - 'package*.json'
      - '.github/workflows/seed-reset-checks.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: seedtester
          POSTGRES_PASSWORD: seed_test_local
          POSTGRES_DB: mathapp_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U seedtester"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123456789
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      BASE_URL: http://127.0.0.1:3100
      PUSH_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prepare disposable PostgreSQL databases
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          target="seed_reset_test_$(openssl rand -hex 16)"
          control="seed_reset_test_$(openssl rand -hex 16)"
          token="$(openssl rand -hex 16)"
          docker exec "$PG_CONTAINER" createdb -U seedtester "$target"
          docker exec "$PG_CONTAINER" createdb -U seedtester "$control"
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U seedtester -d "$target" \
            -v permit_token="$token" < scripts/seed-reset-permit.sql
          docker exec "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U seedtester -d postgres \
            -c "COMMENT ON DATABASE $control IS 'planimetrika:seed-test-control:$token'"
          url_prefix="postgresql://seedtester:seed_test_local@127.0.0.1:$PG_PORT"
          printf '::add-mask::%s\n' "$token" "$url_prefix/$target" "$url_prefix/$control" "$url_prefix/mathapp_test"
          {
            echo "SEED_RESET_TOKEN=$token"
            echo "SEED_RESET_DATABASE_URL=$url_prefix/$target"
            echo "SEED_RESET_TEST_CONTROL_URL=$url_prefix/$control"
            echo "TEST_DATABASE_URL=$url_prefix/mathapp_test"
            echo "DATABASE_URL=$url_prefix/mathapp_test"
          } >> "$GITHUB_ENV"
          DATABASE_URL="$url_prefix/$target" npx --no-install drizzle-kit migrate
          DATABASE_URL="$url_prefix/$control" npx --no-install drizzle-kit migrate

      - run: npm run test:seed-reset
      - name: Rehearse restoration and reject the inherited reset permit
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          source_db="${SEED_RESET_DATABASE_URL##*/}"
          [[ "$source_db" =~ ^seed_reset_test_[a-f0-9]{32}$ ]]
          saved_db="seed_original_$(openssl rand -hex 16)"
          run_psql() {
            docker exec "$PG_CONTAINER" psql -XAt -v ON_ERROR_STOP=1 -U seedtester "$@"
          }
          identity_sql="SELECT oid, shobj_description(oid, 'pg_database') FROM pg_database WHERE datname = current_database()"
          report_sql='SELECT (SELECT count(*) FROM users), (SELECT count(*) FROM homeworks),
            (SELECT count(*) FROM attempts a JOIN users u ON u.id = a.student_id JOIN problems p ON p.id = a.problem_id),
            (SELECT count(*) FROM srs_states s JOIN users u ON u.id = s.student_id JOIN problems p ON p.id = s.problem_id)'
          fingerprint_sql="SELECT md5(string_agg(entry, '' ORDER BY entry)) FROM (
            SELECT 'u:' || to_jsonb(t)::text AS entry FROM users t
            UNION ALL SELECT 'h:' || to_jsonb(t)::text FROM homeworks t
            UNION ALL SELECT 'a:' || to_jsonb(t)::text FROM attempts t
            UNION ALL SELECT 's:' || to_jsonb(t)::text FROM srs_states t
            UNION ALL SELECT 'p:' || to_jsonb(t)::text FROM problems t
          ) AS rows_to_check"
          original_identity="$(run_psql -d "$source_db" -c "$identity_sql")"
          expected_report="$(run_psql -d "$source_db" -c "$report_sql")"
          expected_fingerprint="$(run_psql -d "$source_db" -c "$fingerprint_sql")"
          docker exec "$PG_CONTAINER" pg_dump -U seedtester -d "$source_db" -Fc --no-owner --no-privileges > "$RUNNER_TEMP/seed.dump"
          run_psql -d postgres -c "ALTER DATABASE $source_db RENAME TO $saved_db"
          docker exec -i "$PG_CONTAINER" pg_restore -U seedtester -d postgres \
            --exit-on-error --create --no-owner --no-privileges < "$RUNNER_TEMP/seed.dump"
          restored_identity="$(run_psql -d "$source_db" -c "$identity_sql")"
          [[ "${restored_identity%%|*}" != "${original_identity%%|*}" ]]
          [[ "${restored_identity#*|}" == "${original_identity#*|}" ]]
          [[ "${restored_identity#*|}" == planimetrika:seed-reset:v2:* ]]
          [[ "$(run_psql -d "$source_db" -c "$report_sql")" == "$expected_report" ]]
          [[ "$(run_psql -d "$source_db" -c "$fingerprint_sql")" == "$expected_fingerprint" ]]

          status=0
          ALLOW_SEED_RESET=1 node --import tsx scripts/seed.ts --reset > "$RUNNER_TEMP/reset-refusal.log" 2>&1 || status=$?
          [[ "$status" == 1 ]]
          grep -Fxq 'Сброс запрещён: одноразовая база не подтверждена.' "$RUNNER_TEMP/reset-refusal.log"
          [[ "$(run_psql -d "$source_db" -c "$fingerprint_sql")" == "$expected_fingerprint" ]]
          printf 'Restored rows and relationships: %s; inherited reset permit refused\n' "$expected_report"


      - name: Verify upgrade from the previous PostgreSQL schema
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          upgrade_db="unlink_upgrade_test"
          docker exec "$PG_CONTAINER" createdb -U seedtester "$upgrade_db"
          upgrade_url="${TEST_DATABASE_URL%/*}/$upgrade_db"
          printf '::add-mask::%s\n' "$upgrade_url"
          export UPGRADE_MIGRATIONS="$RUNNER_TEMP/unlink-previous-drizzle"
          cp -a drizzle "$UPGRADE_MIGRATIONS"
          node -e 'const fs=require("node:fs"); const p=process.env.UPGRADE_MIGRATIONS+"/meta/_journal.json"; const j=JSON.parse(fs.readFileSync(p)); if(j.entries.pop()?.tag!=="0055_rollback_safe_notifications" || j.entries.pop()?.tag!=="0054_verified_parent_links" || j.entries.pop()?.tag!=="0053_student_unlink") process.exit(1); fs.writeFileSync(p,JSON.stringify(j))'
          cat > "$RUNNER_TEMP/unlink-upgrade.config.ts" <<'CONFIG'
          export default { out: process.env.UPGRADE_MIGRATIONS, dialect: "postgresql", dbCredentials: { url: process.env.DATABASE_URL } };
          CONFIG
          DATABASE_URL="$upgrade_url" npx --no-install drizzle-kit migrate --config "$RUNNER_TEMP/unlink-upgrade.config.ts"
          check_psql() {
            docker exec -i "$PG_CONTAINER" psql -XAt -v ON_ERROR_STOP=1 -U seedtester -d "$upgrade_db" "$@"
          }
          check_psql <<'SQL'
          INSERT INTO users(id, email, name, password_hash, role, teacher_id) VALUES
            ('unlink_upgrade_teacher', 'teacher@fixture.invalid', 'Teacher', 'dummy', 'TEACHER', NULL),
            ('unlink_upgrade_student', 'student@fixture.invalid', 'Student', 'dummy', 'STUDENT', 'unlink_upgrade_teacher'),
            ('unlink_upgrade_orphan', 'orphan@fixture.invalid', 'Orphan', 'dummy', 'STUDENT', 'missing_fixture_teacher');
          INSERT INTO users(id, email, name, password_hash, role) VALUES
            ('fixture_parent', 'parent@fixture.invalid', 'Parent', 'dummy', 'PARENT');
          INSERT INTO parent_links(parent_id, student_id) VALUES ('fixture_parent', 'unlink_upgrade_student');
          INSERT INTO notifications(id, user_id, type, title, body, link) VALUES
            ('legacy_notice', 'fixture_parent', 'weekly_report', 'Fixture', 'Historical report', '/parent/child/unlink_upgrade_student');
          INSERT INTO teacher_invites(id, teacher_id, student_id, status)
            VALUES ('fixture_invite', 'unlink_upgrade_teacher', 'unlink_upgrade_student', 'accepted');
          SQL
          legacy_source="$RUNNER_TEMP/unlink-legacy-source"
          mkdir -p "$legacy_source"
          git fetch --no-tags --depth=1 origin c2237657f3e500f695bb505e32e52114aa823520
          git archive c2237657f3e500f695bb505e32e52114aa823520 | tar -x -C "$legacy_source"
          ln -s "$PWD/node_modules" "$legacy_source/node_modules"
          cp tests/integration/rollback-notifications.test.mjs "$legacy_source/rollback-notifications.test.mjs"
          legacy_api() {
            (cd "$legacy_source" && DATABASE_URL="$upgrade_url" node --import tsx rollback-notifications.test.mjs "$1")
          }
          legacy_api 1
          DATABASE_URL="$upgrade_url" npx --no-install drizzle-kit migrate
          [[ "$(check_psql -c "select count(*) from notification_records where id = 'legacy_notice'")" == "1" ]]
          [[ "$(check_psql -c "select count(*) from notifications where user_id = 'fixture_parent'")" == "0" ]]
          DATABASE_URL="$upgrade_url" node --import tsx tests/integration/rollback-notifications.test.mjs 0
          legacy_api 0
          check_psql -c "update parent_link_requests set verified_at = now() where parent_id = 'fixture_parent'"
          [[ "$(check_psql -c "select count(*) from notifications where user_id = 'fixture_parent'")" == "1" ]]
          check_psql -c "update parent_link_requests set verified_at = null where parent_id = 'fixture_parent'"
          [[ "$(check_psql -c "select teacher_id || ':' || independent_credentials::text from users where id = 'unlink_upgrade_student'")" == "unlink_upgrade_teacher:false" ]]
          [[ "$(check_psql -c "select teacher_id from users where id = 'unlink_upgrade_orphan'")" == "missing_fixture_teacher" ]]
          [[ "$(check_psql -c "select count(*) from teacher_invites where id = 'fixture_invite' and status = 'accepted'")" == "1" ]]
          [[ "$(check_psql -c "select count(distinct teacher_link_version) from users where id like 'unlink_upgrade_%'")" == "3" ]]
          [[ "$(check_psql -c "select count(*) from parent_link_requests where parent_id = 'fixture_parent' and verified_at is null")" == "1" ]]
          [[ "$(check_psql -c "select count(*) from parent_links where parent_id = 'fixture_parent'")" == "0" ]]
          if check_psql -c "delete from users where id = 'unlink_upgrade_student'"; then exit 1; fi
          echo "Previous-schema upgrade preserved accounts and links without asserting legacy ownership."

      - run: bash tests/integration/deploy.test.sh
      - run: npm run test:db
      - run: npx --no-install tsx scripts/check-unlink-release.ts
      - run: npm test
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - name: Smoke-test the application
        run: |
          npx --no-install playwright-core install --with-deps chromium
          npx --no-install next start -H 127.0.0.1 -p 3100 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS "$BASE_URL/login" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm run test:e2e

      - name: Recover interrupted release with isolated PM2
        run: npm exec --yes --package=pm2@6.0.8 -- bash tests/integration/deploy-pm2.test.sh

      - name: Smoke-test worker launch and restoration with isolated PM2
        run: npm exec --yes --package=pm2@6.0.8 -- node tests/integration/telegram-ready.test.mjs

  expo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx --no-install tsc --noEmit
        working-directory: mobile
      - run: npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/android-unlink-bundle"
        working-directory: mobile
