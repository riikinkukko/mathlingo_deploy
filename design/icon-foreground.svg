<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Adaptive icon foreground: система сама накладывает маску (круг,
       squircle, квадрат — зависит от лаунчера), поэтому весь контент
       должен помещаться в "safe zone" — примерно 66% от центра холста,
       иначе на части лаунчеров лицо будет обрезано по краям. Здесь
       "лицо" уменьшено и отцентрировано с этим запасом. -->
  <g transform="translate(512 512) scale(0.72) translate(-512 -512)">
    <ellipse cx="512" cy="512" rx="336" ry="336" fill="#EFFFF7" stroke="#0F5132" stroke-width="18"/>
