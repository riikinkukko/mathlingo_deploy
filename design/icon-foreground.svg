    <circle cx="404" cy="480" r="54" fill="#0F5132"/>
    <circle cx="385" cy="461" r="17" fill="#FFFFFF"/>
    <circle cx="620" cy="480" r="62" fill="#FFFFFF"/>
    <circle cx="620" cy="480" r="54" fill="#0F5132"/>
    <circle cx="601" cy="461" r="17" fill="#FFFFFF"/>
    <path d="M 380 585 A 132 95 0 0 0 644 585 A 160 60 0 0 1 380 585 Z" fill="#0F5132"/>
    <ellipse cx="322" cy="565" rx="38" ry="24" fill="#F0B0A8" opacity="0.55"/>
    <ellipse cx="702" cy="565" rx="38" ry="24" fill="#F0B0A8" opacity="0.55"/>
