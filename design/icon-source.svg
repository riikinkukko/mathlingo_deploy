<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон — закруглённый квадрат, основной зелёный цвет брендбука -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#22C55E"/>

  <!-- Мягкий блик сверху для объёма (как у "тела" в оригинальном маскоте) -->
  <ellipse cx="512" cy="260" rx="340" ry="220" fill="#6EE7B7" opacity="0.35"/>

  <!-- "Лицо" — светлый овал, как у полной фигуры маскота, просто крупнее и без тела/рук -->
  <ellipse cx="512" cy="512" rx="336" ry="336" fill="#EFFFF7" stroke="#0F5132" stroke-width="18"/>

  <!-- Глаза — та же геометрия (блик + тёмный зрачок с бликом), что в components/Mascot.tsx -->
  <circle cx="404" cy="480" r="62" fill="#FFFFFF"/>
  <circle cx="404" cy="480" r="54" fill="#0F5132"/>
  <circle cx="385" cy="461" r="17" fill="#FFFFFF"/>

  <circle cx="620" cy="480" r="62" fill="#FFFFFF"/>
  <circle cx="620" cy="480" r="54" fill="#0F5132"/>
  <circle cx="601" cy="461" r="17" fill="#FFFFFF"/>

  <!-- Улыбка — простая гладкая дуга (полуэллипс), даёт чистую "радостную"
       форму без изломов, в отличие от составной кривой -->
  <path
    d="M 380 585 A 132 95 0 0 0 644 585 A 160 60 0 0 1 380 585 Z"
    fill="#0F5132"
  />

  <!-- Румянец — фирменный элемент из брендбука -->
  <ellipse cx="322" cy="565" rx="38" ry="24" fill="#F0B0A8" opacity="0.55"/>
  <ellipse cx="702" cy="565" rx="38" ry="24" fill="#F0B0A8" opacity="0.55"/>
</svg>
